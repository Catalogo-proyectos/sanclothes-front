name: sanclothes

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5014/api}
        NEXT_PUBLIC_HEALTH_URL: ${NEXT_PUBLIC_HEALTH_URL:-http://localhost:5014/health}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-http://localhost:5012}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-development}
        NEXT_PUBLIC_FEATURE_LOYALTY: ${NEXT_PUBLIC_FEATURE_LOYALTY:-true}
        NEXT_PUBLIC_FEATURE_REFERRALS: ${NEXT_PUBLIC_FEATURE_REFERRALS:-true}
        NEXT_PUBLIC_FEATURE_SIZE_FINDER: ${NEXT_PUBLIC_FEATURE_SIZE_FINDER:-true}
        NEXT_PUBLIC_FEATURE_GIFT_CARDS: ${NEXT_PUBLIC_FEATURE_GIFT_CARDS:-true}
        NEXT_PUBLIC_LOG_LEVEL: ${NEXT_PUBLIC_LOG_LEVEL:-debug}
        NEXT_PUBLIC_JWT_STORAGE_KEY: ${NEXT_PUBLIC_JWT_STORAGE_KEY:-sant_auth_token}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SANTCLOTHES_API_ORIGIN: ${NEXT_PUBLIC_SANTCLOTHES_API_ORIGIN:-}
    image: sanclothes-front:latest
    container_name: sanclothes-front
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
